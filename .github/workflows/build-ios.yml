name: Build iShell IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iShell (unsigned IPA)
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install native build tools
        run: brew install meson ninja

      - name: Show Apple toolchain
        run: xcodebuild -version

      - name: Verify submodules
        run: |
          git submodule status
          test -f deps/linux/arch/ish/Makefile
          test -f deps/libapps/hterm/bin/mkdist
          test -f deps/libarchive/CMakeLists.txt

      - name: Build unsigned archive
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project iSH.xcodeproj \
            -scheme iSH \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/iShell.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            archive | tee build/xcodebuild.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/iShell.xcarchive/Products/Applications/iShell.app"
          test -d "$APP_PATH"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/iShell.app
          (cd build && zip -qry iShell-unsigned.ipa Payload)
          ls -lh build/iShell-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iShell-unsigned-ipa
          path: build/iShell-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xcode log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iShell-xcodebuild-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14
